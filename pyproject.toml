[project]
name = "senzori-web"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [".venv", "htmlcov"]

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B", "S"]
ignore = ["E501", "S101"]
