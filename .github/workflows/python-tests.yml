name: Python compile and tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app.py tests

      - name: Start Flask API
        run: |
          flask --app app run --host=127.0.0.1 --port=8001 &
          echo $! > flask.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Flask API did not start"
          exit 1

      - name: Run pytest
        env:
          API_URL: http://127.0.0.1:8001
        run: |
          set -o pipefail
          python -m pytest -v tests 2>&1 | tee pytest-report.log

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.log
          if-no-files-found: error
