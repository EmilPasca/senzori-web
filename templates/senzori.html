<!-- templates/senzori.html -->
 <html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Senzori</title>
    <link rel="stylesheet" href="../static/style.css">

</head>
<body>
<h1>Senzorii mei</h1>
<table>
  <tr><th>ID</th><th>Cod</th><th>Locație</th></tr>
  {% for s in senzori %}
  <tr>
    <td><a href="{{ url_for('senzori', senzor_id=s.id) }}">{{ s.id }}</a></td>
    <td>{{ s.cod }}</td><td>{{ s.locatie }}</td>
  </tr>
  {% endfor %}
</table>
<p>În demonstrație, autentifică-te ca <strong>cosmin</strong>, apoi deschide
direct ID-ul unui senzor al Alinei (de exemplu <code>/senzori/1</code>).</p>
<p><a href="{{ url_for('profil') }}">Înapoi la profil</a></p>
